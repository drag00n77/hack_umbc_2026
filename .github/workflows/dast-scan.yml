name: Dynamic DAST Scan & Gemini Analysis

on:
  # Allows your application backend to trigger this workflow via a secure API POST request
  repository_dispatch:
    types: [trigger-dast-scan]

jobs:
  dast_and_analyze:
    runs-on: ubuntu-latest
    name: Execute Dynamic DAST and AI Enrichment
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Parse the dynamic target input passed from your web UI
      - name: Extract Target URL and Metadata
        id: vars
        run: |
          echo "TARGET_URL=${{ github.event.client_payload.target_url }}" >> $GITHUB_ENV
          echo "SCAN_ID=${{ github.event.client_payload.scan_id }}" >> $GITHUB_ENV

      # 2. Run the dynamic target scan
      - name: Run OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: ${{ env.TARGET_URL }}
          artifact_name: 'zap_scan_report'
          fail_action: false # Keeps the runner alive to ensure data processing continues

      # 3. Spin up Python to handle the native Gemini SDK processing
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-genai requests

      # 4. Stream findings into Gemini & POST back to your dashboard application database
      - name: Run Gemini Vulnerability Breakdown
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
        run: |
          python - << 'EOF'
          import os
          import json
          import requests
          from google import genai
          from google.genai import types

          # Load raw JSON scan results from the ZAP runner output path
          try:
              with open('zap_out.json', 'r') as file:
                  scan_data = json.load(file)
          except Exception as e:
              print(f"Error reading scan file: {e}")
              exit(1)

          # Initialize the Google GenAI SDK client
          client = genai.Client(api_key=os.environ.get("GEMINI_API_KEY"))

          # Build a strict structured instruction prompt for remediation
          prompt = f"Analyze this raw web security scanner report. Extract the top vulnerabilities and provide explicit exploitation steps and source-code level remediation recommendations for each:\n\n{json.dumps(scan_data)[:30000]}"

          print("Sending raw scan artifacts to Gemini API for processing...")
          response = client.models.generate_content(
              model='gemini-2.5-flash',
              contents=prompt,
              config=types.GenerateContentConfig(
                  response_mime_type="application/json",
                  system_instruction="You are an advanced Application Security and Penetration Testing AI. Parse raw DAST metrics and outputs into a clean JSON structure containing explicit remediation code blocks."
              ),
          )

          # Forward the enriched payload back to your application dashboard backend
          payload = {
              "scan_id": os.environ.get("SCAN_ID"),
              "target_url": os.environ.get("TARGET_URL"),
              "raw_results": scan_data,
              "ai_analysis": json.loads(response.text)
          }

          print("Broadcasting enriched vulnerabilities to application backend dashboard...")
          res = requests.post(os.environ.get("BACKEND_API_URL"), json=payload)
          print(f"Backend Ingest Status: {res.status_code}")
          EOF